{{- /* Bloc d'arguments facultatif : params.pbn.features (liste de title, text) et params.pbn.featuresTitle. Aucune allégation. */ -}}
{{- with site.Params.pbn.features }}
<section class="home-section home-features">
  <div class="container">
    {{- with site.Params.pbn.featuresTitle }}<h2 class="section-title">{{ . }}</h2>{{ end }}
    <div class="features">
      {{- range . }}
      <div class="feature"><h3>{{ .title }}</h3><p>{{ .text }}</p></div>
      {{- end }}
    </div>
  </div>
</section>
{{- end }}
