{{- /* Recherche sur l'index search-index.json de la langue (params.pbn.search). */ -}}
{{- if site.Params.pbn.search }}{{ with site.Home.OutputFormats.Get "searchindex" }}
<div class="search" data-search="{{ .RelPermalink }}">
  <form class="search-form" role="search" action="{{ site.Home.RelPermalink }}">
    <label for="search-{{ $.Kind }}" class="sr-only">{{ i18n "search_label" }}</label>
    <input id="search-{{ $.Kind }}" type="search" name="q" placeholder="{{ i18n "search_placeholder" }}" data-placeholder-short="{{ i18n "search_placeholder_short" }}" autocomplete="off" data-search-input>
    <button type="submit" aria-label="{{ i18n "search_button" }}"><span class="search-btn-text">{{ i18n "search_button" }}</span><svg class="search-btn-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  </form>
  <div class="search-results" data-search-results hidden>
    <ul data-search-list></ul>
    <p data-search-empty hidden>{{ i18n "search_no_results" }}</p>
  </div>
</div>
{{- end }}{{ end -}}
